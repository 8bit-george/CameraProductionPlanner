<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Production Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">Camera Production Planner</div>
    <div class="toolbar-actions">
      <label class="button">
        Import Background
        <input id="backgroundInput" type="file" accept="image/png,image/jpeg,image/webp">
      </label>
      <button id="addCamera">+ Add Camera</button>
      <button id="exportPng">Export PNG</button>
      <button id="exportPdf">Export PDF</button>
      <button id="clearPlan" class="danger">Clear</button>
      <button id="donateButton" class="donate">☕ Support the project</button>
    </div>
  </header>

  <main>
    <section id="workspace">
      <div id="emptyState">
        <div class="empty-title">Production plan</div>
        <div>Import a hall, stage or venue image to begin.</div>
      </div>
      <canvas id="canvas"></canvas>
    </section>

    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Cameras</h2>
        <span id="cameraCount">0</span>
      </div>
      <div id="cameraList" class="camera-list"></div>
      <div id="inspector" class="inspector hidden">
        <h3>Edit camera</h3>
        <label>Name<input id="editName" type="text"></label>
        <label>Description<textarea id="editDescription" rows="5"></textarea></label>
        <label>Lens / notes<input id="editLens" type="text"></label>
        <label>Operator<input id="editOperator" type="text"></label>
        <label>Camera colour
          <select id="editColor">
            <option value="#3b82f6">Blue</option>
            <option value="#ef4444">Red</option>
            <option value="#22c55e">Green</option>
            <option value="#eab308">Yellow</option>
            <option value="#f97316">Orange</option>
            <option value="#a855f7">Purple</option>
            <option value="#ec4899">Pink</option>
            <option value="#06b6d4">Cyan</option>
            <option value="#64748b">Grey</option>
          </select>
        </label>
        <label>Outline colour
          <select id="editOutlineColor">
            <option value="#111318">Black</option>
            <option value="#ffffff">White</option>
          </select>
        </label>
        <div class="inspector-actions">
          <button id="saveCamera">Save</button>
          <button id="cancelEdit" class="secondary">Cancel</button>
        </div>
      </div>
    </aside>
  </main>

<footer>
  <button id="zoomOut">−</button>
  <span id="zoomLabel">100%</span>
  <button id="zoomIn">+</button>

  <span class="footer-divider"></span>

  <span>Camera scale</span>
  <input id="cameraScale" type="range" min="20" max="100" value="40" step="1">
  <span id="cameraScaleLabel">40</span>

  <span class="footer-spacer"></span>

  <span>Drag cameras to position them • Drag the direction handle to aim them</span>
</footer>

  <script src="app.js"></script>
</body>
</html>
